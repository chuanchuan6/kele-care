    <title>可乐的护理记录</title>
    <style>
      :root {
        --wash-top: rgba(255, 247, 240, 0.03);       /* 蒙层上部：几乎不遮，照片优先清楚 */
        --wash-bottom: rgba(255, 247, 240, 0.15);    /* 蒙层下部：只留薄薄一层 */
        --halo: 1px 0 0 rgba(46, 28, 23, 0.95), -1px 0 0 rgba(46, 28, 23, 0.95), 0 1px 0 rgba(46, 28, 23, 0.95), 0 -1px 0 rgba(46, 28, 23, 0.95), 1px 1px 0 rgba(46, 28, 23, 0.92), -1px -1px 0 rgba(46, 28, 23, 0.92), 1px -1px 0 rgba(46, 28, 23, 0.92), -1px 1px 0 rgba(46, 28, 23, 0.92), 0 2px 5px rgba(46, 28, 23, 0.45);
        --glass: rgba(255, 253, 250, 0.88);          /* 卡片毛玻璃底（蒙层变薄后略提底色兜可读性） */
        --glass-2: rgba(255, 240, 235, 0.8);
        --ink: #43302f;
        --ink-2: #6b5148;
        --ink-3: #84655c;
        --photo-ink: #fff8f2;
        --line: rgba(214, 170, 155, 0.45);
        --accent: #e5607f;
        --accent-strong: #d14a6b;
        --accent-soft: rgba(253, 227, 234, 0.85);
        --accent-ink: #b23355;
        --ok: #4c8a52;
        --warn: #9a6206;
        --danger: #b23a30;
        --danger-soft: rgba(249, 220, 214, 0.9);
        --shadow: 0 3px 14px rgba(120, 60, 50, 0.12);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --wash-top: rgba(24, 16, 20, 0.12);
          --wash-bottom: rgba(24, 16, 20, 0.32);
          --halo: 1px 0 0 rgba(12, 6, 9, 0.9), -1px 0 0 rgba(12, 6, 9, 0.9), 0 1px 0 rgba(12, 6, 9, 0.9), 0 -1px 0 rgba(12, 6, 9, 0.9), 1px 1px 0 rgba(12, 6, 9, 0.85), -1px -1px 0 rgba(12, 6, 9, 0.85), 1px -1px 0 rgba(12, 6, 9, 0.85), -1px 1px 0 rgba(12, 6, 9, 0.85);
          --glass: rgba(38, 28, 33, 0.88);
          --glass-2: rgba(52, 38, 44, 0.8);
          --ink: #f6ece8;
          --ink-2: #cdb3ac;
          --ink-3: #b3948b;
          --photo-ink: #fff8f2;
          --line: rgba(190, 140, 125, 0.3);
          --accent: #f093ae;
          --accent-strong: #f7aec4;
          --accent-soft: rgba(84, 42, 55, 0.85);
          --accent-ink: #ffc9d7;
          --ok: #9ccf92;
          --warn: #eebd6d;
          --danger: #f49a90;
          --danger-soft: rgba(84, 42, 37, 0.9);
          --shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17.5px;
        line-height: 1.5;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      }
      .bgwall::after {
        content: ""; position: absolute; inset: 0;
        /* 渐变蒙层：上方更透（脸少遮挡），往下到内容区渐强 */
        background: linear-gradient(180deg, var(--wash-top) 0%, var(--wash-top) 30%, var(--wash-bottom) 78%, var(--wash-bottom) 100%);
      }
      .wrap { max-width: 660px; margin: 0 auto; padding: 0 14px; }

      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(6px) saturate(1.1);
        backdrop-filter: blur(6px) saturate(1.1);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      /* ---------- 页头 ---------- */
      header.app-head { padding: calc(20px + env(safe-area-inset-top)) 2px 2px; text-align: center; }
      header.app-head h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 0.01em; color: var(--photo-ink); text-shadow: var(--halo); }
      header.app-head h1 .paw { font-size: 29px; }
      header.app-head .today-date { margin: 6px 0 0; color: var(--photo-ink); font-size: 17px; font-weight: 700; text-shadow: var(--halo); }

      /* ---------- 区块 ---------- */
      section { margin-top: 12px; }
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 4px 6px; }
      .sec-head h2 { margin: 0; font-size: 17.5px; font-weight: 800; color: var(--photo-ink); text-shadow: var(--halo); }
      .sec-head .hint { color: var(--photo-ink); font-size: 13.5px; font-weight: 700; text-shadow: var(--halo); }

      /* ---------- 项目小瓷砖 ---------- */
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      @media (max-width: 400px) { .cards { grid-template-columns: repeat(2, 1fr); } }
      .card {
        padding: 8px 10px 7px;
        text-align: left;
        font: inherit; color: inherit;
        cursor: pointer; width: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      .card:active { background: var(--glass-2); }
      /* 选中态：蜜桃粉描边 + 浅粉底（同原表单胶囊选中时的高亮） */
      .card[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        box-shadow: 0 0 0 1.5px var(--accent), var(--shadow);
      }
      .card[aria-pressed="true"] .pname { color: var(--accent-ink); }
      .card .pname { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; line-height: 1.25; }
      .card .pname .emo { font-size: 16px; line-height: 1; flex: none; }
      .card .days { margin-top: 2px; line-height: 1.3; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
      .card .days b { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; margin-right: 1px; line-height: 1.1; }
      .card .last { font-size: 13px; font-weight: 500; color: var(--ink-3); line-height: 1.35; }
      .card .st { font-size: 13px; font-weight: 700; line-height: 1.35; }
      .st.fresh { color: var(--ok); }
      .st.mid { color: var(--warn); }
      .st.long { color: var(--danger); }
      .st.none { color: var(--ink-3); }
      .empty-note { grid-column: 1 / -1; color: var(--ink-2); font-size: 15px; font-weight: 600; padding: 4px 2px; }

      /* ---------- 记录条（紧贴瓷砖网格下方，与瓷砖同区） ---------- */
      .rec-bar { padding: 10px 12px 11px; margin-top: 8px; }
      .today-note { display: none; margin: 0 0 10px; padding: 7px 11px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-size: 14.5px; font-weight: 700; }
      .today-note.show { display: block; }
      .soak-wrap[hidden] { display: none; }
      .field-label { display: block; font-size: 14.5px; font-weight: 700; margin: 0 0 6px; }
      .field-label .opt { font-weight: 500; color: var(--ink-3); font-size: 13px; }
      input[type="number"], input[type="text"] {
        font: inherit; font-size: 17px; color: var(--ink);
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px; width: 100%; min-height: 42px;
        color-scheme: light dark;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
      .save-row { display: flex; gap: 8px; margin-top: 9px; }
      .btn {
        font: inherit; font-weight: 700; cursor: pointer;
        border-radius: 999px; border: 1px solid transparent;
        min-height: 46px; padding: 8px 16px; font-size: 16.5px;
        -webkit-tap-highlight-color: transparent;
      }
      .btn-primary { background: var(--accent); color: #fff; flex: 1; }
      @media (prefers-color-scheme: dark) { .btn-primary { color: #38131f; } }
      .btn-primary:active { background: var(--accent-strong); }
      .btn-primary:disabled { opacity: 0.45; cursor: default; }
      .form-msg { margin-top: 9px; font-size: 14.5px; min-height: 1.35em; }
      .form-msg:empty { min-height: 0; margin-top: 0; }
      .form-msg.err { color: var(--danger); font-weight: 700; }
      .form-msg.ok { color: var(--ok); font-weight: 700; }
      .custom-row { display: flex; gap: 8px; margin-top: 9px; }
      .custom-row input { flex: 1; }
      .custom-row .btn { min-height: 44px; background: var(--glass-2); border-color: var(--line); color: var(--ink); font-size: 15px; flex: none; }

      /* ---------- 护理记录：一条记录一个模块，两列左右排版，同行等高 ---------- */
      /* 不设 align-items:start：grid 默认拉伸，同一行两个模块等高，内容从顶部排 */
      .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .timeline[hidden] { display: none; }
      .timeline.older { margin-top: 8px; }
      @media (max-width: 340px) { .timeline { grid-template-columns: 1fr; } }
      .tl-mod { padding: 9px 11px 8px; min-width: 0; height: 100%; }
      .tl-head { font-size: 16.5px; font-weight: 800; letter-spacing: 0.01em; white-space: nowrap; }
      .tl-head .wk { font-size: 13.5px; font-weight: 600; color: var(--ink-3); margin-left: 5px; }
      .tl-rows { list-style: none; margin: 3px 0 0; padding: 0; }
      .tl-row { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; padding: 2px 0; font-size: 15px; font-weight: 700; line-height: 1.35; }
      .tl-row .emo { font-size: 15px; line-height: 1; }
      .tl-row .note { font-size: 13.5px; font-weight: 500; color: var(--ink-2); flex-basis: 100%; }
      .tl-empty { grid-column: 1 / -1; color: var(--ink-2); font-size: 15px; font-weight: 600; padding: 12px 14px; }
      /* 展开 / 收起更早记录的开关 */
      .more-btn { display: block; width: 100%; margin-top: 8px; background: var(--glass); border-color: var(--line); color: var(--accent-ink); }
      .more-btn[hidden] { display: none; }
      .more-btn:active { background: var(--glass-2); }

      footer.note { margin-top: 18px; color: var(--photo-ink); font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.6; text-shadow: var(--halo); }
      footer.note .install-hint { color: var(--ink-3); }
    </style>
  </head>
  <body>
    <div class="bgwall" aria-hidden="true"></div>
    <div class="wrap">
      <header class="app-head">
        <h1>可乐的护理记录 <span class="paw" aria-hidden="true">🐾</span></h1>
        <p class="today-date" id="todayDate"></p>
      </header>

      <section aria-labelledby="h-status">
        <div class="sec-head"><h2 id="h-status">距离上次</h2><span class="hint">点瓷砖选中项目，可多选</span></div>
        <div class="cards" id="cards" role="group" aria-label="护理项目，点瓷砖选中或取消"></div>
        <form class="rec-bar glass" id="recordForm" novalidate>
          <p class="today-note" id="todayNote">今天已经记过一条啦，改完点保存会更新它，不会多出一条。</p>
          <div class="soak-wrap" id="soakWrap" hidden>
            <label class="field-label" for="soakInput">浸泡时长（分钟）<span class="opt">选填</span></label>
            <input type="number" id="soakInput" min="1" max="999" step="1" inputmode="numeric" placeholder="泡药浴 / 泡碘伏·妇炎洁时填" />
          </div>
          <div class="save-row">
            <button type="submit" class="btn btn-primary" id="saveBtn">保存记录</button>
          </div>
          <div class="form-msg" id="formMsg" role="status" aria-live="polite"></div>
          <div class="custom-row">
            <input type="text" id="customInput" maxlength="12" placeholder="加个新项目，比如：美容" aria-label="自定义项目名称" />
            <button type="button" class="btn" id="addCustomBtn">＋ 添加</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="h-timeline">
        <div class="sec-head"><h2 id="h-timeline">护理记录</h2><span class="hint" id="tlCount"></span></div>
        <div class="timeline" id="timeline"></div>
        <div class="timeline older" id="timelineOlder" hidden></div>
        <button type="button" class="btn more-btn" id="moreBtn" aria-expanded="false" hidden></button>
      </section>

      <footer class="note">
        <span id="installHint">装到主屏幕：点浏览器底部的<strong>分享</strong> → <strong>「添加到主屏幕」</strong>，就像 App 一样用 🐾<br /></span>
        记录保存在这台手机的浏览器里，换手机或清数据前记得先截图备份。
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        var PRESET = ["普通洗澡", "洗药浴", "体内驱虫", "体外驱虫", "碘伏·妇炎洁", "剪指甲"];
        /* 每个项目的小图标（仅显示用，不影响记录数据） */
        var EMOJI = { "普通洗澡": "🛁", "洗药浴": "🧴", "体内驱虫": "💊", "体外驱虫": "🐛", "碘伏·妇炎洁": "🫧", "剪指甲": "✂️" };
        function emojiOf(p) { return EMOJI[p] || "🐾"; }
        var LS_KEY = "kele-care-records-v1";
        var LS_CUSTOM_KEY = "kele-care-custom-projects-v1";

        /* ---------- 本地存储：记录保存在这台手机的浏览器里 ---------- */
        function loadJSON(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            if (!raw) return fallback;
            var val = JSON.parse(raw);
            return val == null ? fallback : val;
          } catch (e) { return fallback; }
        }
        function saveJSON(key, val) {
          try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
        }

        var records = loadJSON(LS_KEY, []);
        if (!Array.isArray(records)) records = [];
        records = records.filter(function (r) {
          return r && typeof r.date === "string" && Array.isArray(r.items) && r.items.length;
        });
        var customProjects = loadJSON(LS_CUSTOM_KEY, []);
        if (!Array.isArray(customProjects)) customProjects = [];
        customProjects = customProjects.filter(function (p) {
          return typeof p === "string" && p && PRESET.indexOf(p) === -1;
        });

        function allProjects() { return PRESET.concat(customProjects); }
        function persist() {
          saveJSON(LS_KEY, records);
          saveJSON(LS_CUSTOM_KEY, customProjects);
        }

        /* ---------- 旧项目名迁移：洗澡→普通洗澡、药浴→洗药浴、碘伏/妇炎洁→碘伏·妇炎洁，历史记录一并改名（合并后同条去重） ---------- */
        (function migrateNames() {
          var RENAME = { "洗澡": "普通洗澡", "药浴": "洗药浴", "碘伏": "碘伏·妇炎洁", "妇炎洁": "碘伏·妇炎洁" };
          var changed = false;
          records.forEach(function (r) {
            var seen = {};
            r.items = r.items.map(function (p) {
              if (RENAME[p]) { changed = true; return RENAME[p]; }
              return p;
            }).filter(function (p) {
              if (seen[p]) return false;
              seen[p] = true;
              return true;
            });
          });
          /* 自定义项目里若有旧名也一并改，避免和预设重复出现 */
          var seenCustom = {};
          customProjects = customProjects.map(function (p) {
            if (RENAME[p]) { changed = true; return RENAME[p]; }
            return p;
          }).filter(function (p) {
            if (PRESET.indexOf(p) !== -1 || seenCustom[p]) return false;
            seenCustom[p] = true;
            return true;
          });
          if (changed) persist();
        })();

        /* ---------- 一次性导入：原版（Muse 托管版）的 7 条历史记录，合并而非覆盖 ---------- */
        (function importLegacy() {
          var LS_IMPORT_KEY = "kele-care-import-legacy-v1";
          var done = false;
          try { done = !!localStorage.getItem(LS_IMPORT_KEY); } catch (e) {}
          if (done) return;
          var SEEDS = [
            { date: "2026-08-24", items: ["普通洗澡"], soak: null },
            { date: "2026-09-03", items: ["普通洗澡"], soak: null },
            { date: "2026-09-12", items: ["普通洗澡", "碘伏·妇炎洁"], soak: 18 },
            { date: "2026-09-22", items: ["普通洗澡"], soak: null },
            { date: "2026-10-05", items: ["普通洗澡"], soak: null },
            { date: "2026-10-15", items: ["普通洗澡", "洗药浴", "碘伏·妇炎洁"], soak: 20 },
            { date: "2026-11-01", items: ["普通洗澡", "碘伏·妇炎洁"], soak: 15 }
          ];
          function sigOf(r) {
            return r.date + "|" + r.items.slice().sort().join(",") + "|" + (r.soak == null ? "" : r.soak);
          }
          var have = {};
          records.forEach(function (r) { have[sigOf(r)] = true; });
          var base = Date.now();
          SEEDS.forEach(function (s, i) {
            if (have[sigOf(s)]) return;
            records.push({
              id: "imp" + base.toString(36) + i,
              date: s.date, items: s.items.slice(), soak: s.soak,
              createdAt: base + i
            });
          });
          persist();
          try { localStorage.setItem(LS_IMPORT_KEY, "1"); } catch (e) {}
        })();

        /* ---------- 日期工具（只按日期算，不含时分） ---------- */
        function pad(n) { return (n < 10 ? "0" : "") + n; }
        function todayStr() {
          var d = new Date();
          return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }
        function parseDate(s) {
          var p = s.split("-");
          return new Date(+p[0], +p[1] - 1, +p[2]);
        }
        function daysBetween(a, b) {
          var ms = parseDate(b).getTime() - parseDate(a).getTime();
          return Math.round(ms / 86400000);
        }
        function fmtDate(s) {
          var d = parseDate(s);
          var now = new Date();
          var base = (d.getMonth() + 1) + "月" + d.getDate() + "日";
          return d.getFullYear() === now.getFullYear() ? base : d.getFullYear() + "年" + base;
        }
        var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        function fmtWeek(s) { return WEEK[parseDate(s).getDay()]; }

        /* ---------- 状态计算 ---------- */
        function sortedRecords() {
          return records.slice().sort(function (a, b) {
            if (a.date !== b.date) return a.date < b.date ? 1 : -1;
            return (b.createdAt || 0) - (a.createdAt || 0);
          });
        }
        function lastDateOf(project) {
          var best = null;
          records.forEach(function (r) {
            if (r.items.indexOf(project) !== -1 && (!best || r.date > best)) best = r.date;
          });
          return best;
        }
        /* 某条记录里，某项目距离它上一次的天数（没有上一次返回 null） */
        function gapFor(record, project) {
          var prev = null;
          records.forEach(function (r) {
            if (r.id === record.id) return;
            if (r.items.indexOf(project) === -1) return;
            if (r.date < record.date && (!prev || r.date > prev)) prev = r.date;
          });
          return prev ? daysBetween(prev, record.date) : null;
        }

        /* ---------- DOM ---------- */
        var cardsEl = document.getElementById("cards");
        var timelineEl = document.getElementById("timeline");
        var olderEl = document.getElementById("timelineOlder");
        var moreBtn = document.getElementById("moreBtn");
        var tlCountEl = document.getElementById("tlCount");
        var form = document.getElementById("recordForm");
        var soakWrap = document.getElementById("soakWrap");
        var soakInput = document.getElementById("soakInput");
        var saveBtn = document.getElementById("saveBtn");
        var todayNote = document.getElementById("todayNote");
        var formMsg = document.getElementById("formMsg");
        var customInput = document.getElementById("customInput");
        var addCustomBtn = document.getElementById("addCustomBtn");

        var selected = {};   /* 瓷砖上已选中的项目 */
        var todayId = null;  /* 今天已有记录的 id（有则保存=更新它，不新增第二条） */
        var tlExpanded = false;  /* 更早的记录默认折叠收起，展开状态不跨刷新保留 */
        var SOAK_PROJECTS = ["洗药浴", "碘伏·妇炎洁"];

        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }

        /* ---------- 渲染：项目小瓷砖（点选即选中/取消，可多选） ---------- */
        function statusFor(days) {
          if (days === null) return '<span class="st none">还没记过</span>';
          if (days === 0) return '<span class="st fresh">今天刚做 ✓</span>';
          if (days <= 7) return '<span class="st fresh">状态新鲜</span>';
          if (days <= 30) return '<span class="st mid">有一阵了</span>';
          return '<span class="st long">该安排啦</span>';
        }
        function renderCards() {
          var t = todayStr();
          cardsEl.innerHTML = allProjects().map(function (p) {
            var last = lastDateOf(p);
            var days = last ? daysBetween(last, t) : null;
            var daysHtml, lastHtml;
            if (days === null) {
              daysHtml = '<div class="days">暂无记录</div>';
              lastHtml = "";
            } else {
              daysHtml = '<div class="days"><b>' + days + "</b>天前</div>";
              lastHtml = '<div class="last">上次 ' + fmtDate(last) + "</div>";
            }
            return '<button type="button" class="card glass" data-proj="' + esc(p) +
              '" aria-pressed="' + (selected[p] ? "true" : "false") + '">' +
              '<span class="pname"><span class="emo" aria-hidden="true">' + emojiOf(p) + "</span>" + esc(p) + "</span>" +
              daysHtml + lastHtml + statusFor(days) +
              "</button>";
          }).join("");
          var btns = cardsEl.querySelectorAll("[data-proj]");
          for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener("click", function () {
              toggleProject(this);
            });
          }
        }
        /* 点瓷砖：选中 / 取消选中（原地切换，不跳页不滚动） */
        function toggleProject(btn) {
          var p = btn.getAttribute("data-proj");
          if (selected[p]) delete selected[p]; else selected[p] = true;
          btn.setAttribute("aria-pressed", selected[p] ? "true" : "false");
          setMsg("", "");
          syncSoak();
          syncSaveBtn();
        }

        /* ---------- 渲染：护理记录（一条记录一个模块，两列同行等高；
           默认只露最近 4 条，更早的折叠收起，点开关展开，数据一条不动） ---------- */
        function modHtml(r) {
          var rows = r.items.map(function (p) {
            var g = gapFor(r, p);
            var note = g === null ? "首次记录" : "距上次 " + g + " 天";
            /* 时长只缀在浸泡类项目（洗药浴 / 碘伏·妇炎洁）行上，其他项目不显示 */
            if (r.soak && SOAK_PROJECTS.indexOf(p) !== -1) note += " · 泡 " + r.soak + " 分钟";
            return '<li class="tl-row"><span class="emo" aria-hidden="true">' + emojiOf(p) + "</span>" +
              '<span class="pname">' + esc(p) + "</span>" +
              '<span class="note">· ' + note + "</span></li>";
          }).join("");
          /* 历史记录只展示，没有编辑 / 删除入口；两列窄模块用短日期头 */
          return '<article class="tl-mod glass">' +
            '<div class="tl-head">' + fmtDate(r.date) + '<span class="wk">' + fmtWeek(r.date) + "</span></div>" +
            '<ul class="tl-rows">' + rows + "</ul></article>";
        }
        function renderTimeline() {
          var all = sortedRecords();
          /* 最近 4 条直接展示，其余渲染在折叠区里（默认收起）；
             每行的「距上次」由 gapFor 按全部记录推算，不受折叠影响 */
          var list = all.slice(0, 4);
          var older = all.slice(4);
          if (!list.length) {
            tlCountEl.textContent = "";
            timelineEl.innerHTML = '<div class="tl-empty glass">还没有记录。点上面的瓷砖选好项目，再点「保存记录」就能记上。</div>';
            olderEl.innerHTML = "";
            olderEl.hidden = true;
            moreBtn.hidden = true;
            return;
          }
          tlCountEl.textContent = tlExpanded && older.length
            ? "全部 " + all.length + " 条"
            : "最近 " + list.length + " 条";
          timelineEl.innerHTML = list.map(modHtml).join("");
          olderEl.innerHTML = older.map(modHtml).join("");
          olderEl.hidden = !tlExpanded;
          /* 没有更早的记录时不显示开关；有则带上折叠的条数 */
          moreBtn.hidden = !older.length;
          moreBtn.setAttribute("aria-expanded", tlExpanded ? "true" : "false");
          moreBtn.textContent = tlExpanded
            ? "收起更早的记录 ▴"
            : "展开更早的记录（还有 " + older.length + " 条）▾";
        }
        moreBtn.addEventListener("click", function () {
          tlExpanded = !tlExpanded;
          renderTimeline();
        });

        /* ---------- 记录条 ---------- */
        function setMsg(text, kind) {
          formMsg.textContent = text;
          formMsg.className = "form-msg" + (kind ? " " + kind : "");
        }
        /* 没选中任何瓷砖时，保存按钮置灰 */
        function syncSaveBtn() {
          var any = Object.keys(selected).length > 0;
          saveBtn.disabled = !any;
        }
        function needSoak() {
          return SOAK_PROJECTS.some(function (p) { return selected[p]; });
        }
        /* 浸泡时长框：只有选中洗药浴 / 碘伏·妇炎洁时才显示；藏起时清空，保存的 soak 为 null */
        function syncSoak() {
          var show = needSoak();
          soakWrap.hidden = !show;
          if (!show) soakInput.value = "";
        }
        function syncTodayNote() {
          todayNote.classList.toggle("show", !!todayId);
        }
        /* 打开页面时载入今天已有的记录：瓷砖自动选中、时长按规则回填，保存即更新它 */
        function loadToday() {
          var t = todayStr();
          var rec = null;
          records.forEach(function (r) {
            if (r.date === t && (!rec || (r.createdAt || 0) >= (rec.createdAt || 0))) rec = r;
          });
          if (!rec) return;
          todayId = rec.id;
          rec.items.forEach(function (p) { selected[p] = true; });
          soakInput.value = rec.soak ? rec.soak : "";
        }

        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var items = allProjects().filter(function (p) { return selected[p]; });
          Object.keys(selected).forEach(function (p) { if (items.indexOf(p) === -1) items.push(p); });
          if (!items.length) { setMsg("先点上面的瓷砖选项目，再保存。", "err"); return; }
          /* 新记录永远记在今天，日期不用选、改不了 */
          var soak = null;
          if (needSoak()) {
            var soakRaw = soakInput.value.trim();
            if (soakRaw !== "") {
              soak = parseInt(soakRaw, 10);
              if (isNaN(soak) || soak <= 0 || soak > 999) { setMsg("浸泡时长填 1–999 的分钟数。", "err"); return; }
            }
          }
          var msg;
          if (todayId) {
            /* 今天已经记过：更新今天这条（保持原 id），不新增第二条 */
            records.forEach(function (r) {
              if (r.id === todayId) { r.items = items; r.soak = soak; }
            });
            msg = "已更新今天的记录：" + items.join("、");
          } else {
            var nid = "r" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
            records.push({ id: nid, date: todayStr(), items: items, soak: soak, createdAt: Date.now() });
            todayId = nid;
            msg = "记好了：" + items.join("、") + " · 今天";
          }
          persist();
          renderAll();
          /* 就地反馈：瓷砖天数立即刷新，消息显示在记录条里 */
          setMsg("✓ " + msg, "ok");
        });

        /* ---------- 自定义项目 ---------- */
        function addCustom() {
          var name = customInput.value.trim();
          if (!name) { setMsg("先给新项目起个名字。", "err"); return; }
          if (allProjects().indexOf(name) !== -1) { setMsg("「" + name + "」已经在项目里了。", "err"); return; }
          customProjects.push(name);
          selected[name] = true;
          customInput.value = "";
          persist();
          renderAll();
          setMsg("已添加项目「" + name + "」，新瓷砖已经帮你选中了。", "ok");
        }
        addCustomBtn.addEventListener("click", addCustom);
        customInput.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { ev.preventDefault(); addCustom(); }
        });

        /* ---------- 添加到主屏幕：已从主屏幕打开时隐藏页脚指引 ---------- */
        (function setupInstallHint() {
          var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
          if (standalone) {
            var hint = document.getElementById("installHint");
            if (hint) hint.style.display = "none";
          }
        })();

        /* ---------- 初始化 ---------- */
        function renderAll() {
          renderCards();
          renderTimeline();
          syncSoak();
          syncSaveBtn();
          syncTodayNote();
        }
        /* 页头日期牌：今天几号，只展示、点不动也改不了 */
        (function showToday() {
          var d = new Date();
          var WEEK_FULL = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
          document.getElementById("todayDate").textContent =
            d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WEEK_FULL[d.getDay()];
        })();
        loadToday();
        renderAll();
      })();
    </script>
    <script>
      /* 离线缓存：注册 service worker，页面存进手机后断网/无 VPN 也能开 */
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
