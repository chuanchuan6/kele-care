<style>
:root{
  color-scheme: light dark;
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --ink:#1C1C1E; --ink2:#6E6E73; --ink3:#AEAEB2;
  --line:rgba(60,60,67,.12);
  --pink:#FF2D55; --pink-soft:#FFE3E9; --pink-mid:#FF8FA3;
  --purple:#AF52DE; --purple-soft:#F3E4FB;
  --orange:#FF9500; --teal:#2DB7A3; --blue:#0A84FF; --red:#FF3B30; --green:#34C759;
  --tab-bg:rgba(249,249,249,.92);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#636366;
    --line:rgba(84,84,88,.45);
    --pink-soft:#4A1420; --purple-soft:#38203F;
    --tab-bg:rgba(22,22,24,.92);
    --shadow:none;
  }
}
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent; }
button{ font-family:inherit; cursor:pointer; }
button, [role="button"], select, summary, input:not([type="checkbox"],[type="radio"]){ min-height:2.25rem; }
.wrap{ max-width:560px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom)); }
.page-head{ padding:22px 2px 4px; }
.page-head h1{ font-size:32px; font-weight:800; letter-spacing:-.5px; margin:0; }
.page-head .date-line{ color:var(--ink2); font-size:14px; margin-top:2px; }
.card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:16px; margin-top:14px; }
.cat{ display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; }
.cat .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.cat .chev{ margin-left:auto; color:var(--ink3); font-weight:400; font-size:15px; }
.big-num{ font-size:44px; font-weight:800; letter-spacing:-1px; line-height:1.08; margin-top:8px; }
.big-num small{ font-size:19px; font-weight:700; }
.sub{ color:var(--ink2); font-size:14px; line-height:1.55; margin-top:4px; }
.sub b{ color:var(--ink); }
.pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--pink-soft); color:var(--pink); }
.pill.purple{ background:var(--purple-soft); color:var(--purple); }
.btn-row{ display:flex; gap:10px; margin-top:14px; }
.btn{ flex:1; border:none; border-radius:14px; padding:13px 8px; font-size:16px; font-weight:700; min-height:48px; }
.btn.primary{ background:var(--pink); color:#fff; }
.btn.ghost{ background:var(--card2); color:var(--pink); border:1px solid var(--line); }
.btn:disabled{ opacity:.45; }
.btn:active{ transform:scale(.98); }
.mini-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.mini{ background:var(--card2); border-radius:12px; padding:10px 12px; }
.mini .k{ font-size:12.5px; color:var(--ink2); }
.mini .v{ font-size:19px; font-weight:800; margin-top:2px; }
.mini .v small{ font-size:12.5px; font-weight:600; color:var(--ink2); }
.todo-row{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
.todo-row:first-of-type{ border-top:none; }
.todo-ic{ width:36px; height:36px; border-radius:10px; background:var(--pink-soft); display:flex; align-items:center; justify-content:center; flex:none; }
.todo-row .t{ flex:1; font-size:15.5px; font-weight:600; }
.todo-row .t span{ display:block; font-size:12.5px; color:var(--ink2); font-weight:400; margin-top:1px; }
.todo-go{ border:none; background:var(--pink); color:#fff; font-size:14px; font-weight:700; border-radius:999px; padding:8px 16px; min-height:36px; }
.todo-done{ color:var(--green); font-size:14px; font-weight:700; }
.alert-line{ display:flex; gap:9px; padding:9px 0; font-size:14.5px; line-height:1.5; border-top:1px solid var(--line); }
.alert-line:first-of-type{ border-top:none; }
.alert-line .ai{ flex:none; margin-top:1px; }
.empty-note{ color:var(--ink2); font-size:14.5px; line-height:1.6; }
/* 日历 */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.cal-head .m{ font-size:19px; font-weight:800; }
.nav-btn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--pink); font-size:19px; display:flex; align-items:center; justify-content:center; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:10px; }
.cal-wd{ text-align:center; font-size:12px; color:var(--ink2); font-weight:600; padding:4px 0; }
.cal-day{ position:relative; aspect-ratio:1/1.12; border:none; background:transparent; border-radius:12px; font-size:15px; font-weight:600; color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px 0; min-height:44px; }
.cal-day.dim{ color:var(--ink3); }
.cal-day .dnum{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
.cal-day.f1 .dnum{ background:#FFD3DC; color:#8F0F2A; }
.cal-day.f2 .dnum{ background:#FFB3C1; color:#7A0B22; }
.cal-day.f3 .dnum{ background:#FF8FA3; color:#fff; }
.cal-day.f4 .dnum{ background:var(--pink); color:#fff; }

<script>
/* ============ 工具 ============ */
function $(s){ return document.querySelector(s); }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addD(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function diffD(a,b){ return Math.round((parseD(fmt(a))-parseD(fmt(b)))/86400000); }
function todayStr(){ return fmt(new Date()); }
function cnDate(s){ var d=parseD(s); var w='日一二三四五六'[d.getDay()]; return d.getMonth()+1+'月'+d.getDate()+'日 周'+w; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var toastTimer=null;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200); }

/* ============ 数据（localStorage，只存本机） ============ */
var LS_KEY='xiaoyueli_v1';
var CHECK_DEFS=[
  {id:'folic', who:'her', title:'叶酸 · 每日补充', desc:'按医生建议的剂量，点一下记今天已吃'},
  {id:'her_check', who:'her', title:'她的孕前检查', desc:'妇科、甲功、优生五项等，做完打卡'},
  {id:'dental', who:'her', title:'口腔检查', desc:'孕前洗牙/补牙，孕期处理牙齿更麻烦'},
  {id:'him_quit', who:'him', title:'他的戒烟酒', desc:'点一下记今天做到，备孕期尽量全程坚持'},
  {id:'him_check', who:'him', title:'他的孕前检查', desc:'精液常规等，做完打卡'}
];
function defaultState(){ return { periods:[], days:{}, checks:{}, preg:null }; }
function load(){
  try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var s=JSON.parse(raw); if(s&&s.periods) return s; } }catch(e){}
  return defaultState();
}
var S=load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function dayRec(ds){ if(!S.days[ds]) S.days[ds]={}; return S.days[ds]; }

/* ============ 周期计算 ============ */
function sortedPeriods(){ return S.periods.slice().sort(function(a,b){ return a.start<b.start?-1:1; }); }
function calc(){
  var ps=sortedPeriods();
  var r={ periods:ps, count:ps.length, avgCycle:null, spread:0, avgLen:null, next:null, ovu:null, fertile:null, best:null, ongoing:null, lastEnd:null };
  if(!ps.length) return r;
  var lens=[];
  ps.forEach(function(p){ if(p.end) lens.push(diffD(parseD(p.end),parseD(p.start))+1); });
  if(lens.length) r.avgLen=Math.round(lens.slice(-6).reduce(function(a,b){return a+b;},0)/lens.length*10)/10;
  var last=ps[ps.length-1];
  if(last && !last.end) r.ongoing=last;
  if(last && last.end) r.lastEnd=last;
  if(ps.length>=2){
    var ivs=[];
    for(var i=1;i<ps.length;i++) ivs.push(diffD(parseD(ps[i].start),parseD(ps[i-1].start)));
    var use=ivs.slice(-6);
    r.avgCycle=Math.round(use.reduce(function(a,b){return a+b;},0)/use.length*10)/10;
    r.spread=Math.max(1, Math.round((Math.max.apply(null,use)-Math.min.apply(null,use))/2));
    if(!S.preg){
      var lenUse=r.avgLen||5;
      r.next=fmt(addD(parseD(last.start), Math.round(r.avgCycle)));
      r.ovu=fmt(addD(parseD(r.next),-14));
      r.fertile=[fmt(addD(parseD(r.ovu),-5)), fmt(addD(parseD(r.ovu),1))];
      r.best=[fmt(addD(parseD(r.ovu),-2)), r.ovu];
      r.predLen=Math.round(lenUse);
    }
  }
  return r;
}
function inPeriod(ds, c){
  return c.periods.some(function(p){ return ds>=p.start && ds<=(p.end||todayStr()); });
}
function phaseOf(ds, c){
  if(S.preg) return 'preg';
  if(inPeriod(ds,c)) return 'period';
  if(c.next){
    if(ds>=c.fertile[0] && ds<=c.fertile[1]) return ds===c.ovu?'ovu':'fertile';
    if(ds>=c.next) return 'late';
    var dn=diffD(parseD(c.next),parseD(ds));
    if(dn<=5 && dn>0) return 'pre';
    if(ds>c.periods[c.periods.length-1].start) return 'post';
  }
  return c.periods.length?'post':'none';
}
var PHASE_TXT={ period:'经期', post:'经后恢复期', fertile:'易孕期', ovu:'排卵日附近', pre:'经前期', late:'已推迟', preg:'待确认怀孕', none:'尚未记录' };
var FLOW_TXT=['点滴','少量','中量','大量'];
var PAIN_TXT=['无','轻','中','重'];
var SYMPTOMS=['肚子疼','腰酸','头疼','胸胀','长痘','乏力','情绪低落'];
var MOODS=['很好','还行','一般','低落','烦躁'];
var LH_TXT=['阴性','弱阳','强阳','转弱'];
var DIS_TXT=['干','黏稠','蛋清拉丝'];

<script>

    } else if(left===0){

  if(c.next && !S.preg){
    var toOvu=diffD(parseD(c.ovu), new Date());
    html+='<div class="card"><div class="cat" style="color:var(--purple)"><span class="dot" style="background:var(--purple)"></span>排卵与易孕期<span class="chev">›</span></div>';
    if(toOvu>0) html+='<div class="big-num">'+toOvu+'<small> 天后排卵</small></div>';
    else if(toOvu===0) html+='<div class="big-num">今天<small> 预计排卵</small></div>';
    else html+='<div class="big-num" style="font-size:32px">本周期排卵日已过</div>';
    html+='<div class="sub">预计排卵日 <b>'+cnDate(c.ovu)+'</b><br>易孕期：'+cnDate(c.fertile[0])+' – '+cnDate(c.fertile[1])+'<br>最佳时机：'+cnDate(c.best[0])+' – '+cnDate(c.best[1])+'（日历上有 ♥ 的日子）</div>'
      +'<div class="sub" style="margin-top:6px">以上按周期推算，只是估算，不能当避孕依据。</div></div>';
  }
  /* 今日待办：只剩记量一项 */
  if(c.ongoing){
    var rec=S.days[t]||{};
    html+='<div class="card"><div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>今日待办</div>'
      +'<div class="todo-row"><div class="todo-ic"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 3c3.2 4.2 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.8 7.2 12 3z" fill="#FF2D55"/></svg></div>'
      +'<div class="t">记今天的量<span>点一档就行：点滴 / 少量 / 中量 / 大量</span></div>'
      +(rec.flow!=null?'<span class="todo-done">已记 · '+FLOW_TXT[rec.flow]+'</span>':'<button class="todo-go" id="sum-flow">去记</button>')
      +'</div></div>';
  }
  /* 提醒卡 */
  var alerts=buildAlerts(c);
  if(alerts.length){
    html+='<div class="card"><div class="cat" style="color:var(--orange)"><span class="dot" style="background:var(--orange)"></span>提醒</div>';
    alerts.forEach(function(a){ html+='<div class="alert-line"><span class="ai">'+a.icon+'</span><span>'+a.text+'</span></div>'; });
    html+='</div>';
  }
  /* 上次小结 */
  if(c.lastEnd){
    var lp=c.lastEnd, len=diffD(parseD(lp.end),parseD(lp.start))+1, peak=null, peakV=-1, total=0;
    for(var d=0; d<len; d++){ var ds=fmt(addD(parseD(lp.start),d)); var r=S.days[ds]; if(r&&r.flow!=null){ total++; if(r.flow>peakV){ peakV=r.flow; peak=ds; } } }
    html+='<div class="card"><div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>上次经期小结</div>'
      +'<div class="mini-grid"><div class="mini"><div class="k">时间</div><div class="v" style="font-size:16px">'+(parseD(lp.start).getMonth()+1)+'/'+parseD(lp.start).getDate()+' – '+(parseD(lp.end).getMonth()+1)+'/'+parseD(lp.end).getDate()+'</div></div>'
      +'<div class="mini"><div class="k">总天数</div><div class="v">'+len+'<small> 天</small></div></div>'
      +'<div class="mini"><div class="k">高峰日</div><div class="v" style="font-size:16px">'+(peak?cnDate(peak)+(peakV>=0?' · '+FLOW_TXT[peakV]:''):'未记量')+'</div></div>'
      +'<div class="mini"><div class="k">记了量的天数</div><div class="v">'+total+'<small> / '+len+' 天</small></div></div></div></div>';
  }
  html+=installCard();
  $('#sum-body').innerHTML=html; bindSummary(c);
}
function installCard(){ return ''; }
function buildAlerts(c){
  var out=[], t=todayStr();
  if(c.ongoing){
    var len=diffD(new Date(), parseD(c.ongoing.start))+1;
    if(len>7) out.push({icon:'⚠️', text:'这次经期已经 <b>'+len+' 天</b>还没结束，比一般情况长，建议去妇科看看。'});
    var heavy=0; for(var i=0;i<len;i++){ var r=S.days[fmt(addD(parseD(c.ongoing.start),i))]; if(r&&r.flow===3) heavy++; }
    if(heavy>=2) out.push({icon:'⚠️', text:'这次已经有 <b>'+heavy+' 天记了「大量」</b>，如果伴随头晕、乏力，建议尽快去妇科检查。'});
  }
  if(c.next && !S.preg){
    var left=diffD(parseD(c.next), new Date());
    if(left===2||left===1) out.push({icon:'🩸', text:'预计 <b>'+left+' 天后</b>来经期，记得提前备好卫生用品。'});
    if(left<0) out.push({icon:'🤍', text:'经期已推迟 <b>'+(-left)+' 天</b>，可以在清单页记一次早孕测试结果；推迟超过一周还没来，建议去医院看看。'});
    var tf=diffD(parseD(c.fertile[0]), new Date());
    if(tf===1) out.push({icon:'💜', text:'明天进入易孕期，日历上标 ♥ 的日子是建议安排的日子。'});
    if(t>=c.best[0] && t<=c.best[1]) out.push({icon:'💜', text:'现在是<b>最佳时机</b>（排卵前 2 天到排卵日），日历上已标 ♥。'});
  }
  return out;
}
function bindSummary(c){
  var st=$('#sum-start'); if(st) st.addEventListener('click', function(){ startPeriod(todayStr()); });
  var en=$('#sum-end'); if(en) en.addEventListener('click', function(){ endPeriod(todayStr()); });
  var td=$('#sum-today'); if(td) td.addEventListener('click', function(){ openSheet(todayStr()); });
  var fl=$('#sum-flow'); if(fl) fl.addEventListener('click', function(){ openSheet(todayStr()); });
  var gl=$('#sum-golist'); if(gl) gl.addEventListener('click', function(){ switchTab('list'); });
  var up=$('#sum-unpreg'); if(up) up.addEventListener('click', function(){ if(this.getAttribute('data-arm')){ S.preg=null; save(); renderAll(); toast('已恢复经期预测'); } else { this.setAttribute('data-arm','1'); this.textContent='再点一次确认撤销'; } });
}
function startPeriod(ds){
  var c=calc();
  if(c.ongoing){ toast('已经在经期中了'); return; }
  S.periods.push({start:ds, end:null}); save(); renderAll(); toast('已记下：'+cnDate(ds)+' 开始');
}
function endPeriod(ds){
  var c=calc();
  if(!c.ongoing){ toast('还没有正在进行的经期'); return; }
  if(ds<c.ongoing.start){ toast('结束日不能早于开始日'); return; }
  c.ongoing.end=ds; save(); renderAll(); toast('已记下：'+cnDate(ds)+' 结束');
}

/* ============ 日历 ============ */
var calCursor=new Date(); calCursor.setDate(1);
var calSelected=todayStr();
function renderCalendar(){
  var y=calCursor.getFullYear(), m=calCursor.getMonth();
  $('#cal-title').textContent=y+'年'+(m+1)+'月';
  var wd=['日','一','二','三','四','五','六'], wh='';
  wd.forEach(function(w){ wh+='<div class="cal-wd">'+w+'</div>'; });
  $('#cal-wd').innerHTML=wh;
  var c=calc();
  var first=new Date(y,m,1), startDay=first.getDay();
  var gridStart=addD(first,-startDay);
  var html='';
  for(var i=0;i<42;i++){
    var d=addD(gridStart,i), ds=fmt(d), cls=['cal-day'];
    if(d.getMonth()!==m) cls.push('dim');
    if(ds===todayStr()) cls.push('today');
    var rec=S.days[ds]||{};
    var isPeriod=inPeriod(ds,c);
    if(isPeriod) cls.push('f'+((rec.flow!=null?rec.flow:1)+1));
    else if(c.next && !S.preg){
      var plen=c.predLen||5;
      var pend=fmt(addD(parseD(c.next),plen-1));
      if(ds>=c.next && ds<=pend) cls.push('pred');
      else if(ds>=c.fertile[0] && ds<=c.fertile[1]) cls.push(ds===c.ovu?'ovu':(ds>=c.best[0]&&ds<=c.best[1]?'best':'fertile'));
    }
    var marks='';
    if(rec.sex) marks+='♥';
    if(rec.lh===2) marks+='◆';
    html+='<button class="'+cls.join(' ')+'" data-date="'+ds+'"><span class="dnum">'+d.getDate()+'</span><span class="marks">'+marks+'</span></button>';
  }
  $('#cal-grid').innerHTML=html;
  var btns=document.querySelectorAll('#cal-grid .cal-day');
  for(var j=0;j<btns.length;j++) btns[j].addEventListener('click', function(){ calSelected=this.getAttribute('data-date'); renderCalDetail(); openSheet(calSelected); });
  renderCalDetail();
}
function renderCalDetail(){
  var ds=calSelected, c=calc(), rec=S.days[ds]||{}, parts=[];
  var ph=phaseOf(ds,c);
  parts.push('<b>'+cnDate(ds)+'</b> · '+PHASE_TXT[ph]);
  if(rec.flow!=null) parts.push('量：'+FLOW_TXT[rec.flow]);
  if(rec.pain!=null) parts.push('痛经：'+PAIN_TXT[rec.pain]);
  if(rec.sex) parts.push('♥ 已记同房');
  if(rec.lh===2) parts.push('试纸强阳');
  $('#cal-detail').innerHTML='<div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>所选日期</div><div class="sub" style="margin-top:8px;font-size:15px;color:var(--ink)">'+parts.join('　')+'</div><button class="text-btn" id="cal-edit">编辑这天的记录 ›</button>';
  $('#cal-edit').addEventListener('click', function(){ openSheet(ds); });
}
</script>

<script>
/* ============ 每日记录 sheet ============ */
var sheetDate=todayStr();
function openSheet(ds){
  sheetDate=ds; renderSheet();
  $('#sheet-mask').classList.add('open'); $('#sheet').classList.add('open');
}
function closeSheet(){ $('#sheet-mask').classList.remove('open'); $('#sheet').classList.remove('open'); renderAll(); }
function tileGroup(label, items, cur, attr, extraCls){
  var h='<div class="group-t">'+label+'</div><div class="tiles">';
  items.forEach(function(it, i){
    h+='<button class="tile '+(extraCls||'')+(cur===i?' on':'')+'" data-'+attr+'="'+i+'">'+it+'</button>';
  });
  return h+'</div>';
}
function renderSheet(){
  var ds=sheetDate, rec=dayRec(ds), c=calc();
  $('#sheet-title').textContent=cnDate(ds);
  var isStart=false, isEnd=false, inPeriod=false;
  c.periods.forEach(function(p){ if(p.start===ds) isStart=true; if(p.end===ds) isEnd=true; });
  inPeriod=inPeriod(ds,c);
  $('#sheet-sub').textContent=inPeriod?'经期中':'非经期';
  var h='';
  /* 经期起止 */
  h+='<div class="group-t">经期</div><div class="tiles">';
  h+='<button class="tile'+(isStart?' on':'')+'" id="sh-start">这天开始</button>';
  h+='<button class="tile'+(isEnd?' on':'')+'" id="sh-end">这天结束</button>';
  if(isStart||isEnd) h+='<button class="tile" id="sh-undoperiod">取消起止标记</button>';
  h+='</div>';
  /* 经期组 */
  var flowItems=FLOW_TXT.map(function(f,i){ return '<span class="drop" style="opacity:'+(0.35+i*0.22)+'"></span>'+f; });
  h+=tileGroup('量（点一档）', flowItems, rec.flow, 'flow');
  h+=tileGroup('痛经程度', PAIN_TXT, rec.pain, 'pain');
  h+='<div class="group-t">症状（可多选）</div><div class="tiles">';
  SYMPTOMS.forEach(function(s){ var on=(rec.symptoms||[]).indexOf(s)>=0; h+='<button class="tile'+(on?' on':'')+'" data-sym="'+esc(s)+'">'+s+'</button>'; });
  h+='</div>';
  h+=tileGroup('心情', MOODS, rec.mood, 'mood');
  /* 备孕组 */
  h+='<div class="group-t">备孕记录</div>';
  h+='<div style="display:flex;align-items:center;gap:10px"><input type="number" class="field" id="sh-bbt" inputmode="decimal" step="0.01" min="35" max="38" placeholder="基础体温 如 36.52" value="'+(rec.bbt!=null?rec.bbt:'')+'"><span style="color:var(--ink2);font-size:14px">℃（晨起未活动时测）</span></div>';
  h+=tileGroup('排卵试纸', LH_TXT, rec.lh, 'lh', 'purple');
  if(rec.lh===2) h+='<div class="window-tip">💜 已记到<b>强阳</b>：未来 <b>24–36 小时</b>是关键窗口，排卵通常就在这段时间发生。</div>';
  h+=tileGroup('白带状态', DIS_TXT, rec.discharge, 'dis');
  h+='<div class="group-t">同房</div><div class="tiles"><button class="tile'+(rec.sex?' on':'')+'" id="sh-sex">♥ 今天有同房</button></div>';
  /* 备注 */
  h+='<div class="group-t">备注（选填）</div><textarea class="field" id="sh-note" placeholder="想记一句就写，不写也行">'+esc(rec.note||'')+'</textarea>';
  $('#sheet-body').innerHTML=h;
  /* 绑定 */
  bindTiles('flow', function(v){ rec.flow=v; });
  bindTiles('pain', function(v){ rec.pain=v; });
  bindTiles('mood', function(v){ rec.mood=v; });
  bindTiles('lh', function(v){ rec.lh=v; });
  bindTiles('dis', function(v){ rec.discharge=v; });
  var syms=document.querySelectorAll('[data-sym]');
  for(var i=0;i<syms.length;i++) syms[i].addEventListener('click', function(){
    var s=this.getAttribute('data-sym'); rec.symptoms=rec.symptoms||[];
    var ix=rec.symptoms.indexOf(s); if(ix>=0) rec.symptoms.splice(ix,1); else rec.symptoms.push(s);
    save(); renderSheet();
  });
  $('#sh-sex').addEventListener('click', function(){ rec.sex=!rec.sex; save(); renderSheet(); });
  $('#sh-bbt').addEventListener('change', function(){ var v=parseFloat(this.value); rec.bbt=isNaN(v)?null:v; save(); toast('体温已保存'); });
  $('#sh-note').addEventListener('change', function(){ rec.note=this.value; save(); });
  var st=$('#sh-start'); if(st) st.addEventListener('click', function(){
    var cc=calc(); if(cc.ongoing && cc.ongoing.start!==ds){ toast('先结束正在进行的经期'); return; }
    if(!isStart){ S.periods.push({start:ds,end:null}); save(); }
    renderSheet();
  });
  var en=$('#sh-end'); if(en) en.addEventListener('click', function(){
    var target=null; S.periods.forEach(function(p){ if(ds>=p.start && !p.end) target=p; });
    if(target){ target.end=ds; save(); renderSheet(); } else toast('这天之前没有未结束的经期');
  });
  var un=$('#sh-undoperiod'); if(un) un.addEventListener('click', function(){
    S.periods.forEach(function(p){ if(p.end===ds) p.end=null; });
    S.periods=S.periods.filter(function(p){ return p.start!==ds; });
    save(); renderSheet(); toast('已取消这天的起止标记');
  });
}
function bindTiles(attr, fn){
  var els=document.querySelectorAll('[data-'+attr+']');
  for(var i=0;i<els.length;i++) els[i].addEventListener('click', function(){
    fn(parseInt(this.getAttribute('data-'+attr),10)); save(); renderSheet();
  });
}

/* ============ 统计 ============ */
function renderStats(){
  var c=calc(), html='';
  html+='<div class="card"><div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>周期概览</div><div class="mini-grid">'
    +'<div class="mini"><div class="k">平均周期</div><div class="v">'+(c.avgCycle?c.avgCycle+'<small> 天</small>':'—')+'</div></div>'
    +'<div class="mini"><div class="k">平均经期</div><div class="v">'+(c.avgLen?c.avgLen+'<small> 天</small>':'—')+'</div></div>'
    +'<div class="mini"><div class="k">已记录周期</div><div class="v">'+c.count+'<small> 次</small></div></div>'
    +'<div class="mini"><div class="k">周期浮动</div><div class="v">'+(c.avgCycle?'±'+c.spread+'<small> 天</small>':'—')+'</div></div></div>'
    +(c.avgCycle?'':'<div class="sub" style="margin-top:10px">记满两次经期开始日后，这里会显示平均周期，预测也会开始工作。</div>')+'</div>';
  /* 周期走势 */
  if(c.periods.length>=2){
    var ivs=[]; for(var i=1;i<c.periods.length;i++) ivs.push({v:diffD(parseD(c.periods[i].start),parseD(c.periods[i-1].start)), at:c.periods[i].start});
    var use=ivs.slice(-6), mx=Math.max.apply(null,use.map(function(x){return x.v;}).concat([35]));
    html+='<div class="card"><div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>最近周期走势<span class="chev">天</span></div><div class="bar-row">';
    use.forEach(function(x){ html+='<div class="bar-col"><div class="bv">'+x.v+'</div><div class="bar" style="height:'+Math.round(x.v/mx*62)+'px"></div><div class="bl">'+(parseD(x.at).getMonth()+1)+'/'+parseD(x.at).getDate()+'</div></div>'; });
    html+='</div></div>';
  }
  /* 量的趋势 */
  var done=c.periods.filter(function(p){return p.end;}).slice(-6);
  if(done.length){
    html+='<div class="card"><div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>量的趋势<span class="chev">每次总量档位合计</span></div><div class="bar-row">';
    var sums=done.map(function(p){ var len=diffD(parseD(p.end),parseD(p.start))+1, s=0, n=0; for(var d=0;d<len;d++){ var r=S.days[fmt(addD(parseD(p.start),d))]; if(r&&r.flow!=null){ s+=r.flow+1; n++; } } return {s:s,n:n,at:p.start,len:len}; });
    var mx2=Math.max.apply(null,sums.map(function(x){return x.s;}).concat([4]));
    sums.forEach(function(x){ html+='<div class="bar-col"><div class="bv">'+(x.n?x.s:'—')+'</div><div class="bar flowbar" style="height:'+(x.n?Math.max(5,Math.round(x.s/mx2*62)):5)+'px;opacity:'+(x.n?1:.3)+'"></div><div class="bl">'+(parseD(x.at).getMonth()+1)+'/'+parseD(x.at).getDate()+'<br>'+x.len+'天</div></div>'; });
    html+='</div><div class="sub">柱子越高，那次经期总量越大；没记量的次数只作占位。突然明显变多或变少，值得留意。</div></div>';
  }
  /* 症状排行 */
  var cnt={}; Object.keys(S.days).forEach(function(k){ (S.days[k].symptoms||[]).forEach(function(s){ cnt[s]=(cnt[s]||0)+1; }); });
  var ranks=Object.keys(cnt).map(function(k){return {k:k,v:cnt[k]};}).sort(function(a,b){return b.v-a.v;});
  if(ranks.length){
    html+='<div class="card"><div class="cat" style="color:var(--orange)"><span class="dot" style="background:var(--orange)"></span>常见症状排行</div>';
    var top=ranks[0].v;
    ranks.forEach(function(r){ html+='<div class="rank-row"><span class="rn">'+esc(r.k)+'</span><span class="rank-track"><span class="rank-fill" style="display:block;width:'+Math.round(r.v/top*100)+'%"></span></span><span class="rc">'+r.v+' 次</span></div>'; });
    html+='</div>';
  }
  /* 基础体温曲线（仅统计页） */
  html+=bbtCard(c);
  $('#stats-body').innerHTML=html;
}
function bbtCard(c){
  var pts=[];
  Object.keys(S.days).sort().forEach(function(k){ var r=S.days[k]; if(r.bbt!=null) pts.push({d:k,v:r.bbt}); });
  var h='<div class="card"><div class="cat" style="color:var(--orange)"><span class="dot" style="background:var(--orange)"></span>基础体温曲线</div>';
  if(pts.length<3){ h+='<div class="sub" style="margin-top:8px">在每日记录里记晨起体温，攒够几天这里就会画出曲线。排卵后体温通常会升高 0.3–0.5℃ 并保持到下次经期。</div></div>'; return h; }
  var use=pts.slice(-42);
  var vs=use.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs)-0.15, mx=Math.max.apply(null,vs)+0.15;
  var W=320,H=130,PAD=26;
  function X(i){ return PAD+i*(W-PAD-8)/Math.max(1,use.length-1); }
  function Y(v){ return 10+(mx-v)/(mx-mn)*(H-46); }
  var path=use.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ');
  /* 升温识别：后段均值比前段高 >=0.3 */
  var note='';
  if(use.length>=8){
    var half=Math.floor(use.length/2);
    var a1=use.slice(0,half).reduce(function(a,p){return a+p.v;},0)/half;
    var a2=use.slice(half).reduce(function(a,p){return a+p.v;},0)/(use.length-half);
    if(a2-a1>=0.3) note='已识别到明显升温（后半段平均高 '+(a2-a1).toFixed(2)+'℃），和排卵后体温升高的规律吻合。';
    else note='暂时还没识别到明显的排卵后升温，再多记几天看看。';
  }
  h+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:10px" role="img" aria-label="基础体温折线图">'
    +'<line x1="'+PAD+'" y1="'+Y(mx-0.15)+'" x2="'+(W-8)+'" y2="'+Y(mx-0.15)+'" stroke="var(--line)"/>'
    +'<line x1="'+PAD+'" y1="'+Y(mn+0.15)+'" x2="'+(W-8)+'" y2="'+Y(mn+0.15)+'" stroke="var(--line)"/>'
    +'<text x="2" y="'+(Y(mx-0.15)+4)+'" font-size="9" fill="var(--ink2)">'+(mx-0.15).toFixed(1)+'</text>'
    +'<text x="2" y="'+(Y(mn+0.15)+4)+'" font-size="9" fill="var(--ink2)">'+(mn+0.15).toFixed(1)+'</text>'
    +'<path d="'+path+'" fill="none" stroke="#FF9500" stroke-width="2" stroke-linejoin="round"/>'
    +use.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="2.6" fill="#FF9500"/>'; }).join('')
    +'<text x="'+PAD+'" y="'+(H-4)+'" font-size="9" fill="var(--ink2)">'+(parseD(use[0].d).getMonth()+1)+'/'+parseD(use[0].d).getDate()+'</text>'
    +'<text x="'+(W-34)+'" y="'+(H-4)+'" font-size="9" fill="var(--ink2)">'+(parseD(use[use.length-1].d).getMonth()+1)+'/'+parseD(use[use.length-1].d).getDate()+'</text>'
    +'</svg>'
    +'<div class="sub">最近 '+use.length+' 次体温记录，范围 '+Math.min.apply(null,vs).toFixed(2)+' – '+Math.max.apply(null,vs).toFixed(2)+'℃。'+note+'</div></div>';
  return h;
}

/* ============ 清单 + 验孕 ============ */
function renderList(){
  var html='';
  CHECK_DEFS.forEach(function(def){
    var st=S.checks[def.id];
    var done=def.id==='folic' ? (st && st.lastDate===todayStr()) : (st && st.done);
    var sub=def.desc;
    if(def.id==='folic' && st && st.count) sub='累计已打卡 '+st.count+' 天'+(done?' · 今天已吃':'');
    if(def.id!=='folic' && done && st.date) sub='完成于 '+cnDate(st.date);
    html+='<button class="check-row'+(done?' done':'')+'" data-check="'+def.id+'"><span class="check-box">'+(done?'✓':'')+'</span><span class="ct"><b>'+def.title+'</b><span>'+sub+'</span></span><span class="who '+def.who+'">'+(def.who==='her'?'她':'他')+'</span></button>';
  });
  $('#check-body').innerHTML=html;
  var rows=document.querySelectorAll('[data-check]');
  for(var i=0;i<rows.length;i++) rows[i].addEventListener('click', function(){
    var id=this.getAttribute('data-check'); var st=S.checks[id]||(S.checks[id]={});
    if(id==='folic'){ if(st.lastDate===todayStr()){ st.lastDate=null; st.count=Math.max(0,(st.count||1)-1); } else { st.lastDate=todayStr(); st.count=(st.count||0)+1; } }
    else { st.done=!st.done; st.date=st.done?todayStr():null; }
    save(); renderList();
  });
  /* 验孕 */
  var c=calc(), ph='';
  if(S.preg){
    ph='<div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>验孕</div>'
      +'<div class="big-num" style="font-size:30px">已测到阳性 🤍</div>'
      +'<div class="sub">末次月经：'+cnDate(S.preg.lmp)+'<br>参考预产期：<b>'+cnDate(S.preg.due)+'</b>（按末次月经 +280 天推算，仅供参考）<br>请尽快去医院抽血确认，并按医生安排建档产检。</div>'
      +'<div class="btn-row"><button class="btn ghost" id="preg-undo">撤销阳性状态</button></div>';
  } else {
    var tip='记下早孕测试结果，测到阳性后会自动停掉经期预测。';
    if(c.next){ var left=diffD(parseD(c.next), new Date()); if(left<0) tip='预计经期已推迟 '+(-left)+' 天，现在就可以用早孕试纸测了（晨尿更准）。'; else if(left===0) tip='预计经期就是今天，没来的话明天起可以测早孕。'; }
    ph='<div class="cat" style="color:var(--pink)"><span class="dot" style="background:var(--pink)"></span>验孕</div>'
      +'<div class="sub" style="margin-top:8px">'+tip+'</div>'
      +'<div class="btn-row"><button class="btn ghost" id="preg-neg">测了 · 阴性</button><button class="btn primary" id="preg-pos">测了 · 阳性</button></div>'
      +(S.lastTest?'<div class="sub" style="margin-top:8px">上次记录：'+cnDate(S.lastTest.date)+' · '+S.lastTest.result+'</div>':'');
  }
  $('#preg-card').innerHTML=ph;
  var pos=$('#preg-pos'); if(pos) pos.addEventListener('click', function(){
    var cc=calc(); if(!cc.periods.length){ toast('先记一次经期开始日，才能算预产期'); return; }
    var lmp=cc.periods[cc.periods.length-1].start;
    S.preg={ lmp:lmp, due:fmt(addD(parseD(lmp),280)), since:todayStr() };
    S.lastTest={date:todayStr(), result:'阳性'};
    save(); renderAll(); switchTab('summary'); toast('恭喜！已切到待确认怀孕状态');
  });
  var neg=$('#preg-neg'); if(neg) neg.addEventListener('click', function(){ S.lastTest={date:todayStr(), result:'阴性'}; save(); renderList(); toast('已记下：阴性'); });
  var un=$('#preg-undo'); if(un) un.addEventListener('click', function(){ S.preg=null; save(); renderAll(); toast('已恢复经期预测'); });
}

/* ============ 全局 ============ */
function renderAll(){ renderSummary(); renderCalendar(); renderStats(); renderList(); }
function switchTab(name){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab')===name);
  ['summary','calendar','stats','list'].forEach(function(v){ $('#view-'+v).classList.toggle('on', v===name); });
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ switchTab(t.getAttribute('data-tab')); }); });
$('#cal-prev').addEventListener('click', function(){ calCursor.setMonth(calCursor.getMonth()-1); renderCalendar(); });
$('#cal-next').addEventListener('click', function(){ calCursor.setMonth(calCursor.getMonth()+1); renderCalendar(); });
$('#sheet-mask').addEventListener('click', closeSheet);
$('#sheet-close').addEventListener('click', closeSheet);
$('#btn-export').addEventListener('click', function(){
  var box=$('#export-box'); box.style.display='block';
  $('#export-text').value=JSON.stringify(S,null,1);
  toast('备份内容已生成，复制后存好');
});
$('#btn-copy').addEventListener('click', function(){
  var ta=$('#export-text'); ta.select();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){ toast('已复制'); }, function(){ document.execCommand('copy'); toast('已复制'); }); }
  else { document.execCommand('copy'); toast('已复制'); }
});
var clearArmed=false;
$('#btn-clear').addEventListener('click', function(){
  var btn=this;
  if(!clearArmed){ clearArmed=true; btn.textContent='再点一次，确认清空全部记录'; setTimeout(function(){ clearArmed=false; btn.textContent='清空全部'; },3500); return; }
  S=defaultState(); save(); clearArmed=false; btn.textContent='清空全部'; $('#export-box').style.display='none';
  renderAll(); toast('已清空全部记录');
});
renderAll();

/* ============ 离线 / 主屏幕 ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* 个别浏览器作用域受限时静默跳过，不影响使用 */ });
  });
}
</script>
